# SSL.DLL switches (read for every new connection; a copy on C: wins over this one).
# 1 = on, 0 = off.
tls13 = 1             # offer TLS 1.3; 0 = at most TLS 1.2 (servers or middleboxes that break 1.3)
session_cache = 1     # resume TLS sessions
session_persist = 1   # keep the session cache across process restarts
