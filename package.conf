# package.conf -- how the pdk's package.yml builds this repository's SIS (release.yml): the SSL.DLL drop-in for older
# Symbian phones, always on mbedTLS (it is a tenth of OpenSSL's size). The board engine is OpenSSL, but this entry ignores
# ENGINE; ENGINE=mbedtls here only keeps recipes/prepare.sh from fetching and building OpenSSL for nothing.
NAME=tls
ARCHES="arm"
REPOS_arm=""
COMPONENTS_arm="ssl_legacy"
ENV="ENGINE=mbedtls"
# no add-on archive: the image's own SSL.DLL is the board's engine, not this one
ADDON=0
